# Поддержание активности бесплатного хостинга: периодическое обращение к сайту
# (Render «засыпает» без запросов, Supabase приостанавливает проект после 7 дней простоя).
name: keepalive
on:
  schedule:
    - cron: '17 */6 * * *'   # каждые 6 часов (UTC)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос страниц, обращающихся к базе данных
        run: |
          for url in https://ecoservice.onrender.com/events.php https://ecoservice.onrender.com/courses.php; do
            for i in 1 2 3; do
              code=$(curl -s -o /tmp/page.html -w '%{http_code}' --max-time 90 "$url") && [ "$code" = "200" ] && grep -q "мест\|Курс" /tmp/page.html && { echo "OK $url"; break; }
              echo "попытка $i: $url -> $code"; sleep 60
              [ $i = 3 ] && exit 1
            done
          done
